<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Krisalis — Métamorphose</title>
<style>
@font-face{font-family:"Geist";src:url(data:font/woff2;base64,__FONT_B64__) format("woff2");font-weight:100 900;font-style:normal;font-display:block}
:root{--accent:#1E3E71;--ink:#111111;--paper:#FFFFFF;--bg:#EFECE7}
html,body{margin:0;padding:0;background:var(--bg)}
#stage{position:relative;width:1440px;height:1440px;overflow:hidden;background:var(--bg);font-family:"Geist",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#world{position:absolute;left:0;top:0;width:1440px;height:1440px;transform-origin:0 0}
.a{position:absolute;left:0;top:0}
.tx{position:absolute;left:0;top:0;white-space:nowrap;line-height:1;letter-spacing:-0.012em}
.num{font-variant-numeric:tabular-nums}
.box{position:absolute;left:0;top:0;transform-origin:50% 50%}
.sh{box-shadow:0 1px 2px rgba(17,17,17,.05),0 22px 44px -22px rgba(17,17,17,.24)}
svg{overflow:visible;display:block}
.st{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#hud{position:absolute;left:24px;top:20px;font:600 22px/1 "Geist",sans-serif;color:#111;opacity:.55;display:none}
</style>
</head>
<body>
<div id="stage"><div id="world"></div><div id="cursor" class="a"></div><div id="hud"></div></div>
<script>
'use strict';
/* =====================================================================
   Krisalis — Métamorphose. 1440×1440, 120 BPM, 20 bars = 40 s.
   Every style is a pure function of t (seek). No CSS transitions, no timers.
   Springs are closed-form step responses; a value that changes target several
   times is the sum of one spring per change.
   ===================================================================== */
const PERIOD = __PERIOD__;            // measured beat period (s)
const DUR = 80 * PERIOD;              // 20 bars × 4 beats
const at = (m, b, f = 0) => ((m - 1) * 4 + (b - 1) + f) * PERIOD;
const C = 720;
const INK = [17, 17, 17], WHITE = [255, 255, 255], BLUE = [30, 62, 113], BG = [239, 236, 231];
const LOGO = __LOGO__;

/* ------------------------------------------------------------- springs */
function spring(tau, w, z) {
  if (tau <= 0) return 0;
  if (!isFinite(w)) return 1;
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
  }
  return 1 - Math.exp(-w * tau) * (1 + w * tau);
}
// free response towards 0 from displacement x0 with velocity v0
function free(tau, x0, v0, w, z) {
  if (tau <= 0) return x0;
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z), B = (v0 + z * w * x0) / wd;
    return Math.exp(-z * w * tau) * (x0 * Math.cos(wd * tau) + B * Math.sin(wd * tau));
  }
  return Math.exp(-w * tau) * (x0 + (v0 + w * x0) * tau);
}
const SP = {
  morph: [16, .84], snap: [26, .86], fast: [30, .88], slow: [13, .95], soft: [10, 1],
  cam: [7.5, 1], pop: [20, .76], fill: [9, .92], press: [40, .9], release: [22, .8],
};
class Track {
  constructor(v0, sp = SP.morph) { this.v0 = v0; this.last = v0; this.k = []; this.sp = sp; }
  to(t, v, sp) { const s = sp || this.sp; this.k.push([t, v - this.last, s[0], s[1]]); this.last = v; return this; }
  set(t, v) { this.k.push([t, v - this.last, Infinity, 1]); this.last = v; return this; }
  at(t) { let v = this.v0; for (const k of this.k) if (t > k[0]) v += k[1] * spring(t - k[0], k[2], k[3]); return v; }
}
class ColorTrack {
  constructor(c, sp) { this.c = c.map(v => new Track(v, sp)); }
  to(t, c, sp) { this.c.forEach((tr, i) => tr.to(t, c[i], sp)); return this; }
  set(t, c) { this.c.forEach((tr, i) => tr.set(t, c[i])); return this; }
  at(t) { return this.c.map(tr => tr.at(t)); }
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const mixc = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
const css = (c, a = 1) => a >= 1 ? `rgb(${c.map(Math.round).join(',')})` : `rgba(${c.map(Math.round).join(',')},${a.toFixed(3)})`;
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '’');
const ease = u => { u = clamp(u); return u * u * u * (u * (u * 6 - 15) + 10); };   // smootherstep
const f2 = v => v.toFixed(2);

/* ---------------------------------------------------- visibility windows
   Each text/content layer has its own entry and exit times so texts that
   change inside a moving container never overlap. */
function vis(t, wins, k = 1) {
  let best = null;
  for (const [a, b] of wins) {
    const i = spring(t - a, 22, 1), q = b == null ? 0 : spring(t - b, 28, 1);
    const o = i * (1 - q);
    if (!best || o > best.o) best = { o, i, q };
  }
  return { o: best.o, blur: ((1 - best.i) * 12 + best.q * 12) * k, dy: ((1 - best.i) * 14 - best.q * 10) * k };
}
const ON = { o: 1, blur: 0, dy: 0 };

/* ------------------------------------------------------------ DOM utils */
const stage = document.getElementById('stage'), world = document.getElementById('world');
const cursorEl = document.getElementById('cursor'), hud = document.getElementById('hud');
function el(parent, html) {
  const d = document.createElement('div'); d.innerHTML = html.trim();
  const e = d.firstElementChild; parent.appendChild(e); return e;
}
function tx(parent, text, size, weight, color, extra = '') {
  return el(parent, `<div class="tx ${extra}" style="font-size:${size}px;font-weight:${weight};color:${color}">${text}</div>`);
}
function place(e, x, y, v, anchor = 'cc', extra = '') {
  // 'inherit', never 'visible': a child must stay hidden when its parent is hidden
  if (!v || v.o < 0.003) { e.style.visibility = 'hidden'; return false; }
  e.style.visibility = 'inherit';
  const ax = anchor[0] === 'l' ? 0 : anchor[0] === 'c' ? -50 : -100;
  const ay = anchor[1] === 't' ? 0 : anchor[1] === 'c' ? -50 : -100;
  e.style.opacity = Math.min(1, v.o).toFixed(4);
  e.style.transform = `translate(${f2(x)}px,${f2(y + (v.dy || 0))}px) translate(${ax}%,${ay}%) ${extra}`;
  const b = v.blur || 0;
  e.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none';
  return true;
}
function box(e, x, y, w, h, r, extra = '') {
  e.style.transform = `translate(${f2(x)}px,${f2(y)}px) ${extra}`;
  e.style.width = f2(Math.max(0, w)) + 'px'; e.style.height = f2(Math.max(0, h)) + 'px';
  if (r != null) e.style.borderRadius = f2(Math.max(0, r)) + 'px';
}
const show = (e, on) => { e.style.visibility = on ? 'inherit' : 'hidden'; };
function rrect(x0, y0, x1, y1, r) {
  r = Math.max(0, Math.min(r, (x1 - x0) / 2, (y1 - y0) / 2));
  return `M${f2(x0 + r)} ${f2(y0)}H${f2(x1 - r)}A${f2(r)} ${f2(r)} 0 0 1 ${f2(x1)} ${f2(y0 + r)}V${f2(y1 - r)}` +
    `A${f2(r)} ${f2(r)} 0 0 1 ${f2(x1 - r)} ${f2(y1)}H${f2(x0 + r)}A${f2(r)} ${f2(r)} 0 0 1 ${f2(x0)} ${f2(y1 - r)}` +
    `V${f2(y0 + r)}A${f2(r)} ${f2(r)} 0 0 1 ${f2(x0 + r)} ${f2(y0)}Z`;
}

/* --------------------------------------------------------------- icons
   One stroke weight everywhere: 4 world px, round caps and joins. */
const ICON = {
  arrow: (c) => `<svg width="28" height="28" viewBox="0 0 28 28"><path class="st" stroke="${c}" d="M4 14h19M16 7l7 7-7 7"/></svg>`,
  search: (c) => `<svg width="28" height="28" viewBox="0 0 28 28"><circle class="st" stroke="${c}" cx="12" cy="12" r="9"/><path class="st" stroke="${c}" d="M19 19l6 6"/></svg>`,
  house: (c) => `<svg width="28" height="28" viewBox="0 0 28 28"><path class="st" stroke="${c}" d="M4 13L14 4l10 9M7 11v13h14V11"/></svg>`,
  doc: (c) => `<svg width="28" height="34" viewBox="0 0 28 34"><path class="st" stroke="${c}" d="M4 2h13l7 7v23H4zM17 2v7h7M9 19h10M9 25h10"/></svg>`,
  upload: (c) => `<svg width="40" height="40" viewBox="0 0 40 40"><path class="st" stroke="${c}" d="M20 26V6M12 14l8-8 8 8M6 26v8h28v-8"/></svg>`,
  check: (c, s = 28) => `<svg width="${s}" height="${s}" viewBox="0 0 28 28"><path class="st" stroke="${c}" pathLength="1" d="M6 14.5l5.5 5.5L22 8.5"/></svg>`,
  chevL: (c) => `<svg width="28" height="28" viewBox="0 0 28 28"><path class="st" stroke="${c}" d="M17 6l-8 8 8 8"/></svg>`,
  chevR: (c) => `<svg width="28" height="28" viewBox="0 0 28 28"><path class="st" stroke="${c}" d="M11 6l8 8-8 8"/></svg>`,
};

/* ============================================================ measures */
const meas = tx(stage, '', 30, 500, '#111'); meas.style.visibility = 'hidden';
function tw(text, size, weight) { meas.style.fontSize = size + 'px'; meas.style.fontWeight = weight; meas.textContent = text; return meas.getBoundingClientRect().width; }
const M = {};
const TABS = ['Gérance', 'PPE', 'Courtage', 'Fiduciaire'];
const QUERY = '3.5 pièces Monthey';
const ITEMS = [
  { t: 'Appartement 3.5 pièces', s: 'Av. de l’Europe 21, Monthey', tag: 'Gérance' },
  { t: 'Appartement 3.5 pièces', s: 'Rue du Bourg 8, Collombey', tag: 'Gérance' },
  { t: 'Attique 3.5 pièces', s: 'Ch. des Ormeaux 3, Troistorrents', tag: 'Courtage' },
  { t: 'Appartement 3.5 pièces', s: 'Grand-Rue 40, Montreux', tag: 'Courtage' },
  { t: 'Duplex 3.5 pièces', s: 'Rte du Simplon 12, Saint-Maurice', tag: 'Gérance' },
];
const FID = [8200, 17900, 26100, 38400, 49300, 61450, 70800, 79100, 93600, 108900, 124700, 148300];
const MONTHS = ['Janv.', 'Févr.', 'Mars', 'Avr.', 'Mai', 'Juin', 'Juil.', 'Août', 'Sept.', 'Oct.', 'Nov.', 'Déc.'];
const H = { ger: 892, cal: 856, ppe: 790, c1: 516, c2: 908, fid: 860, ec: 732, ec2: 596 };
const CARD_W = 900;
const KW = 744;            // slider track width (leaves room for the rubber-band stretch)

/* logo placement in world space */
const LW = 880, LS = LW / LOGO.vb[0], LH = LOGO.vb[1] * LS;
const LX = C - LW / 2, LY = C - (LH + 60 + 28) / 2;
const DOT = 2 * LOGO.colon[0][2] * LS;
const DOT_X = LX + LOGO.colon[0][0] * LS, DOT_UP = LY + LOGO.colon[0][1] * LS, DOT_LO = LY + LOGO.colon[1][1] * LS;
const DOT_MID = (DOT_UP + DOT_LO) / 2;

function measureAll() {
  M.btnTW = tw('Gérer l’essentiel', 34, 500);
  M.loadW = 104 + tw('Métamorphose en cours', 32, 500) + 48;
  M.tabW = TABS.map(s => tw(s, 30, 500) + 60);
  M.tabX = []; let x = 8; for (const w of M.tabW) { M.tabX.push(x); x += w; }
  M.barW = x + 8;
  M.chipW = 20 + 28 + 12 + tw('⌘K', 24, 500) + 22;
  M.chipTW = tw('⌘K', 24, 500);
  M.toastW1 = 96 + tw('Envoyé', 30, 600) + 44;
  M.toastW2 = 96 + Math.max(tw('Envoyé', 30, 600), tw('Décompte de charges · 1 destinataire', 22, 400)) + 44;
  M.prefix = []; for (let i = 0; i <= QUERY.length; i++) M.prefix.push(tw(QUERY.slice(0, i), 30, 500));
  M.chips = ['82 m²', '2ᵉ étage', 'Libre dès le 1.11'].map(s => tw(s, 22, 500) + 40);
  M.gerBtnTW = tw('Demande de visite', 30, 500);
  M.sendTW = tw('Envoyer au locataire', 30, 500);
  M.tags = ['Gérance', 'Courtage'].map(s => tw(s, 18, 500) + 28);
}
const seg = i => ({ x0: M.tabX[i], x1: M.tabX[i] + M.tabW[i], y0: 8, y1: 104 });
const tabC = i => M.tabX[i] + M.tabW[i] / 2;

/* ============================================================ timeline */
const S = {};   // the one shape
const I = {};   // accent indicator (local to the shape)
let G, CAM, HOV, EVENTS = [];
const ev = (t, type, gain = 1) => EVENTS.push({ t: +t.toFixed(5), type, gain });
const cam = (t, x, y, z, sp) => { CAM.x.to(t, x, sp); CAM.y.to(t, y, sp); CAM.z.to(t, z, sp); };
const T = at;

// state tracks used by content modules
const X = {};
// keystroke schedule (16ths from 15.2)
const KEYS = [];

function buildTimeline() {
  S.cx = new Track(C); S.cy = new Track(C); S.w = new Track(440); S.h = new Track(112); S.r = new Track(56);
  S.sc = new Track(1, SP.snap); S.col = new ColorTrack(INK);
  for (const k of ['x0', 'x1', 'y0', 'y1', 'r', 'o']) I[k] = new Track(0);
  G = new Track(0);
  CAM = { x: new Track(C, SP.cam), y: new Track(C, SP.cam), z: new Track(2.45, SP.cam) };
  HOV = new Track(0, SP.snap);

  const press = (t, amt = .955, up = .11) => { S.sc.to(t, amt, SP.press); S.sc.to(t + up, 1, SP.release); };

  /* ---------------- M1 · bouton */
  HOV.to(T(1, 2), 1).to(T(1, 4), 0);
  S.w.to(T(1, 2), 460, SP.snap);
  press(T(1, 3)); ev(T(1, 3), 'click');
  S.w.to(T(1, 4), 112);
  cam(T(1, 4), C, C, 2.7);

  /* ---------------- M2 · chargement → check → segmenté */
  S.w.to(T(2, 1), M.loadW);
  cam(T(2, 1), C, C, 2.25);
  ev(T(2, 2), 'tick');
  S.w.to(T(2, 3), 112, [20, .86]); S.col.to(T(2, 3), BLUE, [20, 1]);
  cam(T(2, 3), C, C, 2.6);
  ev(T(2, 3), 'success');
  // the blue disc becomes the indicator: identical pixels, invisible hand-over
  const tsw = T(2, 3, .9);
  I.o.set(tsw, 1); I.x0.set(tsw, 0); I.x1.set(tsw, 112); I.y0.set(tsw, 0); I.y1.set(tsw, 112); I.r.set(tsw, 56);
  S.col.set(T(2, 3, .92), WHITE);
  S.w.to(T(2, 4), 640);
  I.x0.to(T(2, 4), 8, SP.fast); I.x1.to(T(2, 4), 316, SP.slow); I.y0.to(T(2, 4), 8); I.y1.to(T(2, 4), 104); I.r.to(T(2, 4), 48);
  cam(T(2, 4), C, C, 1.78);

  /* ---------------- M3 · fusion Kunzle | Rigolet → Krisalis */
  I.x1.to(T(3, 2), 632, SP.fast); ev(T(3, 2), 'click');
  const sw3 = [20, .9];
  I.x0.to(T(3, 3), 0, sw3); I.x1.to(T(3, 3), 640, sw3); I.y0.to(T(3, 3), 0, sw3); I.y1.to(T(3, 3), 112, sw3); I.r.to(T(3, 3), 56, sw3);
  S.col.set(T(3, 3, .84), BLUE); I.o.set(T(3, 3, .88), 0);
  S.w.to(T(3, 4), 360);
  cam(T(3, 4), C, C, 2.45);
  ev(T(3, 4), 'low');

  /* ---------------- M4 · chrysalide → éclosion */
  S.w.to(T(4, 1), 220);
  S.h.to(T(4, 2), 480, [14, .84]); S.r.to(T(4, 2), 110, [14, .84]);
  cam(T(4, 2), C, C, 2.2);
  S.sc.to(T(4, 3), .965, [30, .9]); ev(T(4, 3), 'press');
  S.sc.to(T(4, 4), 1, [24, .8]);
  G.to(T(4, 4), 80, [15, .82]); ev(T(4, 4), 'pop');
  cam(T(4, 4), C, C, 2.0);

  /* ---------------- M5–6 · onglets */
  S.w.to(T(5, 1), M.barW, [15, .86]); S.h.to(T(5, 1), 112, [15, .86]); S.r.to(T(5, 1), 56, [15, .86]);
  S.col.to(T(5, 1), WHITE, [14, 1]);
  G.to(T(5, 1), 0, [22, 1]);
  cam(T(5, 1), C, C, 1.62);
  const s0 = seg(0), tin = T(5, 1, .2);
  I.o.set(tin, 1); I.x0.set(tin, tabC(0)); I.x1.set(tin, tabC(0)); I.y0.set(tin, 56); I.y1.set(tin, 56); I.r.set(tin, 0);
  I.x0.to(tin, s0.x0, SP.pop); I.x1.to(tin, s0.x1, SP.pop); I.y0.to(tin, 8, SP.pop); I.y1.to(tin, 104, SP.pop); I.r.to(tin, 48, SP.pop);
  let cur = 0;
  const tabTo = (t, i) => {
    const s = seg(i), right = i > cur;
    I.x1.to(t, s.x1, right ? SP.fast : SP.slow); I.x0.to(t, s.x0, right ? SP.slow : SP.fast);
    cur = i; ev(t, 'tab');
  };
  [[T(5, 2), 1], [T(5, 3), 2], [T(5, 4), 3], [T(6, 1), 2], [T(6, 2), 1], [T(6, 3), 0]].forEach(([t, i]) => tabTo(t, i));
  S.w.to(T(6, 4), CARD_W); S.h.to(T(6, 4), H.ger);
  cam(T(6, 4), C, C, 1.42);

  /* ---------------- M7–8 · Gérance */
  X.planDraw = t => spring(t - T(7, 1), 7, 1);
  X.rent = t => 1500 + 280 * spring(t - T(7, 2), 7, 1);
  X.gerHover = new Track(0, SP.snap).to(T(7, 3), 1).to(T(7, 4, .3), 0);
  X.gerPress = new Track(1, SP.press).to(T(7, 4), .97).to(T(7, 4, .22), 1, SP.release);
  ev(T(7, 4), 'click');
  S.h.to(T(7, 4), H.cal); cam(T(7, 4), C, C, 1.45);
  X.dayHover = t => spring(t - T(8, 1), 22, 1) * (1 - spring(t - T(8, 2), 30, 1));
  X.daySel = t => spring(t - T(8, 2), 20, .74);
  ev(T(8, 1), 'hover', .5);
  ev(T(8, 2), 'click');
  X.slotSel = t => spring(t - T(8, 3), 20, 1);
  ev(T(8, 3), 'click');
  ev(T(8, 4), 'success');

  /* ---------------- M9–10 · PPE */
  tabTo(T(9, 1), 1); S.h.to(T(9, 1), H.ppe); cam(T(9, 1), C, C, 1.48);
  X.vote = [T(9, 3), T(9, 4), T(10, 1)].map(t0 => t => spring(t - t0, 9, .9));
  [T(9, 3), T(9, 4), T(10, 1)].forEach(t => ev(t, 'fill'));
  X.badge = t => spring(t - T(10, 2), 18, .72);
  ev(T(10, 2), 'pop');
  X.tog1 = T(10, 3); ev(T(10, 3), 'toggle');

  /* ---------------- M11–12 · Courtage */
  tabTo(T(11, 1), 2); S.h.to(T(11, 1), H.c1); cam(T(11, 1), C, C, 1.45);
  ev(T(11, 2), 'grab');
  ev(T(12, 1), 'snap');
  S.h.to(T(12, 2), H.c2); cam(T(12, 2), C, C, 1.42);
  X.pin = t => spring(t - T(12, 3), 18, .74);
  ev(T(12, 3), 'pop');
  X.pinChip = T(12, 4);

  /* ---------------- M13–14 · Fiduciaire */
  tabTo(T(13, 1), 3); S.h.to(T(13, 1), H.fid); cam(T(13, 1), C, C, 1.45);
  X.draw = t => .46 * spring(t - T(13, 2), 9, 1) + .54 * spring(t - T(13, 3), 8, 1);
  X.tog2 = T(14, 3); ev(T(14, 3), 'toggle');

  /* ---------------- M15–16 · ⌘K */
  ev(T(15, 1), 'click');
  I.o.to(T(15, 1), 0, [24, 1]);
  S.h.to(T(15, 1), 112, [17, .86]);
  cam(T(15, 1), C, C, 1.46);
  // keystrokes on 16ths: « 3.5 » on 15.2, list on 15.3 (« p »), 2 results on 16.1 (« Mo »), 1 result on 16.2 (« Month »)
  const ks = [T(15, 2), T(15, 2, .25), T(15, 2, .5), T(15, 2, .75), T(15, 3), T(15, 3, .25), T(15, 3, .5), T(15, 3, .75),
    T(15, 4), T(15, 4, .25), T(15, 4, .5), T(15, 4, .75), T(16, 1), T(16, 1, .25), T(16, 1, .5), T(16, 2), T(16, 2, .25), T(16, 2, .5)];
  ks.forEach((t, i) => { KEYS.push(t); ev(t, 'key', QUERY[i] === ' ' ? .7 : 1); });
  // filtering: results only once the query has two words
  X.results = [];   // [t, visibleIdxs]
  let prev = '';
  for (let i = 0; i <= QUERY.length; i++) {
    const q = QUERY.slice(0, i), toks = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const vis = toks.length >= 2 ? ITEMS.map((it, k) => k).filter(k => toks.every(tok => (ITEMS[k].t + ' ' + ITEMS[k].s).toLowerCase().includes(tok))) : [];
    const sig = vis.join(',');
    if (sig !== prev) { X.results.push([i === 0 ? -1 : KEYS[i - 1], vis]); prev = sig; }
  }
  X.searchH = n => n ? 112 + 12 + n * 84 + 12 : 112;
  X.oneAt = X.results.find(([, v]) => v.length === 1)[0];
  for (const [t, v] of X.results) if (t > 0) S.h.to(t, X.searchH(v.length), [18, .86]);
  ev(T(16, 3), 'enter');
  S.h.to(T(16, 4), H.ec, [15, .86]); cam(T(16, 4), C, C, 1.45);

  /* ---------------- M17–18 · Espace client */
  ev(T(17, 1), 'grab'); ev(T(17, 3), 'drop');
  S.h.to(T(17, 3, .3), H.ec2, [15, .86]);
  X.prog = t => .4 * spring(t - T(17, 4), 8, 1) + .6 * spring(t - T(18, 1), 9, 1);
  ev(T(18, 2), 'click');
  S.w.to(T(18, 3), M.toastW1); S.h.to(T(18, 3), 96); S.r.to(T(18, 3), 48); S.col.to(T(18, 3), INK, [16, 1]);
  cam(T(18, 3), C, C, 2.2); ev(T(18, 3), 'success');
  S.w.to(T(18, 4), M.toastW2);

  /* ---------------- M19 · logo */
  S.w.to(T(19, 1), DOT); S.h.to(T(19, 1), DOT); S.r.to(T(19, 1), DOT / 2); S.col.to(T(19, 1), BLUE, [14, 1]);
  S.cx.to(T(19, 1), DOT_X, [12, .9]); S.cy.to(T(19, 1), DOT_MID, [12, .9]);
  cam(T(19, 1), DOT_X, DOT_MID, 3.0, [9, 1]);
  cam(T(19, 3), C, C, 1.4, [7, 1]);
  S.cy.to(T(19, 2), DOT_LO, SP.pop); ev(T(19, 2), 'pop');
  X.dot2 = new Track(DOT_MID, SP.pop).to(T(19, 2), DOT_UP).to(T(20, 2), DOT_MID, [18, .9]);
  for (let i = 0; i < 8; i++) ev(T(19, 3, i / 8), 'letter', .6);

  /* ---------------- M20 · retour au bouton */
  S.cy.to(T(20, 2), DOT_MID, [18, .9]); ev(T(20, 2), 'low');
  cam(T(20, 1, .5), DOT_X, DOT_MID, 2.8, [8, 1]);
  const t20 = T(20, 3);
  S.cx.to(t20, C); S.cy.to(t20, C); S.w.to(t20, 440); S.h.to(t20, 112); S.r.to(t20, 56); S.col.to(t20, INK, [16, 1]);
  ev(t20, 'pop');
  cam(t20, C, C, 2.45, [11, 1]);
}

/* ---------------------------------------------------- shape helpers */
function shapeAt(t) {
  const w = S.w.at(t), h = S.h.at(t);
  return { x0: S.cx.at(t) - w / 2, y0: S.cy.at(t) - h / 2, w, h };
}
const wpos = (t, lx, ly) => { const s = shapeAt(t); return [s.x0 + lx, s.y0 + ly]; };

function mkToggle(parent) {
  const t = {};
  t.track = el(parent, `<div class="box" style="width:96px;height:56px;border-radius:28px"></div>`);

// toggle with two edges on different springs: the leading edge runs ahead, the trailing one catches up
function drawToggle(tg, t, x, y, tOn, v) {
  const e0 = 6 + 40 * spring(t - tOn, SP.slow[0], SP.slow[1]);
  const e1 = 50 + 40 * spring(t - tOn, SP.fast[0], SP.fast[1]);
  const on = spring(t - tOn, 16, 1);
  if (!place(tg.track, x, y, v, 'lt')) { show(tg.knob, false); return; }
  tg.track.style.background = css(mixc(BG, BLUE, on));
  place(tg.knob, x + e0, y + 6, v, 'lt');

function crPath(p) {
  let d = `M${f2(p[0][0])} ${f2(p[0][1])}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(p.length - 1, i + 2)];

}
function crPoint(p, s) {

}

/* ============================================================ cursor path
   Key positions in world space, cyclic over the loop: the cursor at t = 40 s
   has the same position and velocity as at t = 0. */
const CK = [];        // {t, x, y} or {t, t1, fn}
const PRESS = [];     // [down, up]
function buildCursor() {
  const k = (t, p) => CK.push({ t, x: p[0], y: p[1] });
  const hold = (t) => { const p = CK[CK.length - 1]; CK.push({ t, x: p.x, y: p.y }); };
  const off = (t, dx, dy) => { const p = CK[CK.length - 1]; CK.push({ t, x: p.x + dx, y: p.y + dy }); };
  const click = (t, up = .1) => PRESS.push([t, t + up]);

  k(T(1, 1, .9), wpos(T(1, 1, .9), 300, 64)); hold(T(1, 3, .3)); click(T(1, 3));
  off(T(2, 1, .8), 70, 80); off(T(2, 3, .2), 30, -14); off(T(3, 1, .6) - .3, -10, 20);
  k(T(3, 1, .8), wpos(T(3, 1, .8), 478, 64)); hold(T(3, 2, .3)); click(T(3, 2));
  off(T(3, 4, .6), 30, 70); off(T(4, 1, .8), -40, 30);
  k(T(4, 2, .8), wpos(T(4, 2, .8), 110, 250)); hold(T(4, 4, .1)); click(T(4, 3), PERIOD);
  const tabs = [[T(5, 2), 1], [T(5, 3), 2], [T(5, 4), 3], [T(6, 1), 2], [T(6, 2), 1], [T(6, 3), 0]];
  for (const [t, i] of tabs) { k(t - .1, wpos(t - .1, tabC(i), 60)); hold(t + .04); click(t); }
  off(T(6, 4, .7), 60, 170); off(T(7, 1, .8), 30, 120);
  k(T(7, 2, .9), wpos(T(7, 2, .9), 560, 796)); hold(T(7, 4, .25)); click(T(7, 4));
  k(T(8, 1, -.12), wpos(T(8, 1, -.12), 48 + D.cDayPos(5)[0], 216 + D.cDayPos(5)[1])); hold(T(8, 2, .25)); click(T(8, 2));
  k(T(8, 3, -.14), wpos(T(8, 3, -.14), 48 + 176 + 16 + 88, 768)); hold(T(8, 3, .25)); click(T(8, 3));
  off(T(8, 4, .4), 80, -60);
  k(T(9, 1, -.12), wpos(T(9, 1, -.12), tabC(1), 60)); hold(T(9, 1, .1)); click(T(9, 1));
  off(T(9, 2, .6), 200, 300); off(T(9, 4, .2), 120, 140); off(T(10, 2, .2), 60, 100);
  k(T(10, 3, -.14), wpos(T(10, 3, -.14), 804, 688)); hold(T(10, 3, .25)); click(T(10, 3));
  k(T(11, 1, -.12), wpos(T(11, 1, -.12), tabC(2), 60)); hold(T(11, 1, .1)); click(T(11, 1));
  k(T(11, 2, -.12), wpos(T(11, 2, -.12), 48 + .3625 * KW, 414)); hold(T(11, 2));
  // direct manipulation: drag the slider beyond its maximum, hold, release
  k(T(11, 4, .1), wpos(T(11, 4, .1), 930, 406)); k(T(12, 1, -.06), wpos(T(12, 1, -.06), 944, 404)); click(T(11, 2), T(12, 1) - T(11, 2));
  off(T(12, 2, -.2), 6, 10);
  k(T(12, 3, -.12), wpos(T(12, 3, -.12), 48 + 400, 500 + 262 - 4)); hold(T(12, 3, .25)); click(T(12, 3));
  off(T(12, 4, .5), 160, -40);
  k(T(13, 1, -.12), wpos(T(13, 1, -.12), tabC(3), 60)); hold(T(13, 1, .1)); click(T(13, 1));
  off(T(13, 2, .7), -40, 240);
  const P5 = X.pts[5];
  k(T(13, 4, -.1), wpos(T(13, 4, -.1), 48 + P5[0], 400 + P5[1])); hold(T(14, 1));
  // follow the curve from June to December
  CK.push({ t: T(14, 1), t1: T(14, 1, .9), fn: u => { const p = crPoint(X.pts, 5 + 6 * ease(u)); return wpos(T(14, 1), 48 + p[0], 400 + p[1]); } });
  const P11 = X.pts[11]; k(T(14, 1, .9), wpos(T(14, 1), 48 + P11[0], 400 + P11[1])); hold(T(14, 2));
  k(T(14, 3, -.14), wpos(T(14, 3, -.14), 804, 780)); hold(T(14, 3, .25)); click(T(14, 3));

  off(T(15, 2, .6), 40, 70); off(T(15, 4), 20, 40); off(T(16, 1, .6), 30, -20); off(T(16, 3), -20, 30); off(T(16, 4, .6), -30, 60);

  k(T(19, 4, .6), [1086, 884]); k(T(20, 1, .5), [1080, 906]); k(T(20, 2, .4), [1100, 920]);

}
function cursorAt(t) {
  const n = CK.length;
  // find the segment containing t (cyclic)
  let i = n - 1;
  for (let j = 0; j < n; j++) if (CK[j].t <= t) i = j;
  const a = CK[i];
  if (a.fn && t <= a.t1) return a.fn((t - a.t) / (a.t1 - a.t));
  const b = CK[(i + 1) % n];
  let ta = a.fn ? a.t1 : a.t, tb = b.t;
  let tt = t;
  if (i === n - 1) { tb += DUR; if (t < CK[0].t) tt += DUR; }
  if (t < CK[0].t && i === n - 1) ta = a.fn ? a.t1 : a.t;
  const pa = a.fn ? a.fn(1) : [a.x, a.y], pb = b.fn ? b.fn(0) : [b.x, b.y];
  const u = ease((tt - ta) / (tb - ta));
  // slight arc, like a real hand
  const dx = pb[0] - pa[0], dy = pb[1] - pa[1], L = Math.hypot(dx, dy);
  const bow = Math.sin(Math.PI * u) * Math.min(40, .08 * L);
  return [pa[0] + dx * u - (dy / (L || 1)) * bow, pa[1] + dy * u + (dx / (L || 1)) * bow];
}
function pressedAt(t) {
  let p = 0;
  for (const [d, u] of PRESS) p += spring(t - d, 40, .9) - spring(t - u, 26, .8);
  return p;
}

    const frac = clamp((lx - 48) / KW), ex = Math.max(0, lx - 48 - KW);
    return { frac, rub: 64 * (1 - 1 / (1 + ex / 150)) };
  };
  if (t < t0) return { frac: .3625, rub: 0 };
  if (t < t1) return fromX(lxAt(t));
  const a = fromX(lxAt(t1)), b = fromX(lxAt(t1 - 1 / 240));
  const v0 = (a.rub - b.rub) * 240;
  return { frac: 1, rub: free(t - t1, a.rub, v0, 17, .78) };
}

  const st = sliderState(t, x0);
  D.kVal.textContent = `CHF ${fmt(Math.round((400000 + 800000 * st.frac) / 5000) * 5000)}`;
  place(D.kVal, 48, 292, s(2.5), 'lt');
  const v = s(3), kx = 48 + KW * st.frac + st.rub;
  if (place(D.kTrack, 48, 408, v, 'lt')) D.kTrack.style.width = f2(KW + st.rub) + 'px';
  if (place(D.kFill, 48, 408, v, 'lt')) D.kFill.style.width = f2(kx - 48) + 'px';
  const kp = 1 + .15 * (spring(t - T(11, 2), 30, .85) - spring(t - T(12, 1), 22, .85));
  if (place(D.kKnob, kx - .5 * st.rub, 414, v, 'cc', `scale(${kp.toFixed(4)})`)) D.kKnob.style.width = f2(44 + st.rub) + 'px';
  place(D.kMin, 48, 448, s(3.5), 'lt'); place(D.kMax, 48 + KW, 448, s(3.5), 'rt');
  place(D.kMap, 48, 500, vis(t, [[T(12, 2, .05), out + .06]]), 'lt');
  const pin = X.pin(t);
  place(D.kPin, 448, 762 - 80 * (1 - pin), { o: clamp(pin * 3) * vis(t, [[0, out + .06]]).o, blur: 0, dy: 0 }, 'cb');
  place(D.kPinChip, 478, 724, vis(t, [[X.pinChip, out + .06]]), 'lc');
}

/* ---------------------------------------------------- Fiduciaire */
function hoverS(t) {
  if (t < T(13, 4, -.1)) return 5;
  if (t < T(14, 1)) return 5;
  return 5 + 6 * ease((t - T(14, 1)) / (.9 * PERIOD));
}
function renderFid(t, w, h) {
  const out = T(15, 1), s = i => vis(t, [[T(13, 1, .12 + .06 * i), out + .02 * i]]);
  place(D.fTitle, 48, 144, s(0), 'lt');
  place(D.fSub, 48, 198, s(1), 'lt');
  place(D.fLab, 48, 262, s(2), 'lt');
  const p = clamp(X.draw(t));
  const m = p * 11, i0 = Math.min(10, Math.floor(m)), val = lerp(FID[i0], FID[i0 + 1], m - i0);
  D.fVal.textContent = `CHF ${fmt(Math.round(val / 50) * 50)}.–`;
  place(D.fVal, 48, 292, s(2.5), 'lt');
  if (place(D.fChart, 48, 400, s(3), 'lt')) { D.fLine.style.strokeDasharray = '1 1'; D.fLine.style.strokeDashoffset = (1 - p).toFixed(4); }
  const vh = vis(t, [[T(13, 4, -.06), T(14, 2)]], .6);
  const hs = hoverS(t), pt = crPoint(X.pts, hs);
  place(D.fDot, 48 + pt[0], 400 + pt[1], vh, 'cc');
  const hi = Math.round(hs);
  D.fTip.textContent = `${MONTHS[hi]} · CHF ${fmt(FID[hi])}.–`;
  place(D.fTip, 48 + pt[0], 400 + pt[1] - 26, vh, 'cb');
  const vt = s(4);
  place(D.fTogL, 48, 752, vt, 'lt');
  place(D.fTogS1, 48, 792, vis(t, [[T(13, 1, .36), T(14, 4)]]), 'lt');
  place(D.fTogS2, 48, 792, vis(t, [[T(14, 4, .06), out + .1]]), 'lt');
  drawToggle(D.fTog, t, 756, 756, X.tog2, vt);
}

/* ---------------------------------------------------- ⌘K */
function typedAt(t) { let n = 0; for (const k of KEYS) if (t >= k) n++; return n; }
function renderSearch(t, w, h) {
  const tin = T(15, 1, .1), out = T(16, 4);
  const vb = vis(t, [[tin, out]]);
  place(D.sIcon, 56, 56, vb, 'cc');
  place(D.sPh, 96, 56, vis(t, [[T(15, 1, .16), KEYS[0]]], .5), 'lc');
  const n = typedAt(t);
  D.sTx.textContent = QUERY.slice(0, n);
  place(D.sTx, 96, 56, n ? vb : null, 'lc');
  const lastKey = n ? KEYS[n - 1] : tin;
  const blink = (t - lastKey) < .35 || ((t / PERIOD) % 1) < .55;
  place(D.sCaret, 96 + M.prefix[n] + 4, 56, blink && t > tin + .1 ? { ...vb, blur: 0 } : null, 'cc');
  // results
  let rows = [], since = -1;
  for (const [tk, v] of X.results) if (t >= tk) { rows = v; since = tk; }
  place(D.sDiv, 24, 112, rows.length ? vb : null, 'lt'); D.sDiv.style.width = f2(w - 48) + 'px';
  D.sRows.forEach((r, k) => {
    // each item: visible windows from the result history, rank → y with springs
    const wins = []; let open = null; let yT = null;
    for (const [tk, v] of X.results) {
      const rank = v.indexOf(k);
      if (rank >= 0 && open === null) open = tk;
      if (rank < 0 && open !== null) { wins.push([open, tk]); open = null; }
      if (rank >= 0) { const y = 124 + rank * 84; if (!yT) yT = new Track(y, [20, .86]); else yT.to(tk, y); }
    }
    if (open !== null) wins.push([open, out]);
    const v = wins.length ? vis(t, wins.map(([a, b]) => [a + .03 * k, b])) : null;
    const y = yT ? yT.at(t) : 124;
    const first = k === 0;
    const enter = first ? spring(t - T(16, 3), 26, 1) : 0;
    if (place(r.hl, 12, y, first && rows.length ? v : null, 'lt')) {
      r.hl.style.width = f2(w - 24) + 'px';
      r.hl.style.background = css(mixc(BG, BLUE, enter));
    }
    place(r.ic, 56, y + 42, v ? { ...v, o: v.o * (1 - enter) } : null, 'cc'); place(r.icW, 56, y + 42, v ? { ...v, o: v.o * enter } : null, 'cc');
    place(r.t, 96, y + 28, v ? { ...v, o: v.o * (1 - enter) } : null, 'lc'); place(r.tW, 96, y + 28, v ? { ...v, o: v.o * enter } : null, 'lc');
    place(r.s, 96, y + 58, v ? { ...v, o: v.o * (1 - enter) } : null, 'lc'); place(r.sW, 96, y + 58, v ? { ...v, o: v.o * enter } : null, 'lc');
    const shift = first ? 72 * spring(t - X.oneAt, 20, .9) : 0;
    place(r.tag, w - 44 - shift, y + 42, v ? { ...v, o: v.o * (1 - enter) } : null, 'rc');
    if (first) {
      const kp = 1 - .12 * (spring(t - T(16, 3), 40, .9) - spring(t - T(16, 3, .2), 22, .8));
      place(D.sEnter, w - 44, y + 42, vis(t, [[X.oneAt, out]]), 'rc', `scale(${kp.toFixed(4)})`);
    }
  });
}

/* ---------------------------------------------------- Espace client */
function fileState(t, x0, y0) {
  const base = { x: 48, y: 452, w: 804, lift: 0 };
  const t0 = T(17, 1), t1 = T(17, 3), target = { x: 88, y: 242, w: 724 };
  const grabAt = cursorAt(t0), off = [grabAt[0] - (x0 + 48), grabAt[1] - (y0 + 452)];
  const pos = tt => { const c = cursorAt(tt); return [c[0] - x0 - off[0], c[1] - y0 - off[1]]; };
  if (t < t0) return base;
  const lift = spring(t - t0, 26, .86) - spring(t - t1, 22, .9);
  if (t < t1) { const p = pos(t); return { x: p[0], y: p[1], w: 804, lift }; }
  const a = pos(t1), b = pos(t1 - 1 / 240), vx = (a[0] - b[0]) * 240, vy = (a[1] - b[1]) * 240;
  return {
    x: target.x + free(t - t1, a[0] - target.x, vx, 17, .82), y: target.y + free(t - t1, a[1] - target.y, vy, 17, .82),
    w: target.w + free(t - t1, 804 - target.w, 0, 17, .9), lift,
  };
}
function renderEC(t, w, h, x0, y0) {
  const tin = T(16, 4, .1), out = T(18, 3), s = i => vis(t, [[tin + .06 * i, out + .02 * i]]);
  place(D.eEye, 48, 48, s(0), 'lt');
  place(D.eTitle, 48, 84, s(.5), 'lt');
  const hov = spring(t - T(17, 2), 18, 1) - spring(t - T(17, 3, .3), 14, 1);
  if (place(D.eZone, 48, 160, s(1), 'lt')) D.eZoneR.setAttribute('stroke', css(mixc(INK, BLUE, clamp(hov)), lerp(.22, 1, clamp(hov))));
  const vz = vis(t, [[tin + .1, T(17, 3)]]);
  place(D.eUp, 450, 250, vz, 'cc'); place(D.eDrop, 450, 312, vz, 'cc'); place(D.eDropS, 450, 348, vz, 'cc');
  const f = fileState(t, x0, y0);
  if (place(D.eFile, f.x, f.y, s(1.5), 'lt', `scale(${(1 + .025 * f.lift).toFixed(4)})`)) {
    D.eFile.style.width = f2(f.w) + 'px'; D.eFile.style.height = '96px';
    D.eFile.style.boxShadow = `0 ${f2(18 * f.lift)}px ${f2(40 * f.lift)}px -${f2(14 * f.lift)}px rgba(17,17,17,${(.28 * f.lift).toFixed(3)})`;
    D.eName.style.transform = 'translate(84px,34px) translate(0,-50%)';
    const m1 = vis(t, [[-1, T(17, 3)]]), m2 = vis(t, [[T(18, 1, .7), null]]);
    place(D.eMeta, 84, 66, m1, 'lc'); place(D.eMeta2, 84, 66, m2, 'lc');
    const pv = vis(t, [[T(17, 3, .2), T(18, 1, .65)]]), p = clamp(X.prog(t));
    if (place(D.ePTrack, 84, 62, pv, 'lt')) D.ePTrack.style.width = f2(f.w - 84 - 96) + 'px';
    if (place(D.ePFill, 84, 62, pv, 'lt')) D.ePFill.style.width = f2((f.w - 84 - 96) * p) + 'px';
    D.ePct.textContent = `${Math.round(p * 100)} %`;
    place(D.ePct, f.w - 32, 34, pv, 'rc');
    const ok = spring(t - T(18, 1, .7), 18, .74);
    place(D.eOk, f.w - 32, 48, ok > .003 ? { o: clamp(ok * 2), blur: 0, dy: 0 } : null, 'rc', `scale(${Math.max(0, ok).toFixed(4)})`);
    const okp = D.eOk.querySelector('path'); okp.style.strokeDasharray = '1 1'; okp.style.strokeDashoffset = (1 - spring(t - T(18, 1, .8), 15, 1)).toFixed(4);
  }
  const en = spring(t - T(18, 1, .7), 14, 1);
  const pr = 1 - .03 * (spring(t - T(18, 2), 40, .9) - spring(t - T(18, 2, .2), 22, .8));
  const by = lerp(588, 468, spring(t - T(17, 3, .3), 15, .86));
  if (place(D.eSend, 48, by, s(2), 'lt', `scale(${pr.toFixed(4)})`)) {
    D.eSend.style.opacity = (s(2).o * lerp(.18, 1, en)).toFixed(4);
    D.eSendTx.style.transform = `translate(${f2(402 - 18)}px,48px) translate(-50%,-50%)`;
    D.eSendAr.style.transform = `translate(${f2(402 - 18 + M.sendTW / 2 + 22)}px,34px)`;
  }
}

/* ---------------------------------------------------- toast */
function renderToast(t, w, h) {
  const v = vis(t, [[T(18, 3, .1), T(19, 1)]]);
  const c = spring(t - T(18, 3, .12), 18, .74);
  place(D.tCheck, 20, h / 2, v.o > .003 ? { ...v, blur: v.blur * .5 } : null, 'lc', `scale(${Math.max(0, c).toFixed(4)})`);
  D.tCheckP.style.strokeDasharray = '1 1'; D.tCheckP.style.strokeDashoffset = (1 - spring(t - T(18, 3, .22), 15, 1)).toFixed(4);
  const up = spring(t - T(18, 4), 18, .9);
  place(D.tTitle, 96, h / 2 - 15 * up, v, 'lc');
  place(D.tSub, 96, h / 2 + 19, vis(t, [[T(18, 4, .06), T(19, 1)]]), 'lc');
}

/* ---------------------------------------------------- logo */
function renderLogo(t) {
  D.letters.forEach((e, i) => {
    const tin = T(19, 3, i / 8), tout = T(20, 1, (7 - i) / 8);
    const a = spring(t - tin, 20, .9), b = spring(t - tout, 24, 1);
    const o = clamp(a) * (1 - b);
    place(e, LX - 28 * (1 - a) - 40 * b, LY, { o, blur: (1 - clamp(a)) * 10 + b * 10, dy: 0 }, 'lt');
  });
  const vb = vis(t, [[T(19, 4), T(20, 1)]]);
  place(D.base1, LX, LY + LH + 60, vb, 'lt');
  place(D.base2, LX + LW, LY + LH + 60, vb, 'rt');
}

/* ============================================================ init */
window.seek = seek;
window.READY = false;
(async () => {
  await Promise.all(['400', '500', '600'].map(wt => document.fonts.load(`${wt} 30px Geist`)));
  await document.fonts.ready;
  measureAll(); buildTimeline(); buildDOM(); buildCursor();
  window.EVENTS = EVENTS.sort((a, b) => a.t - b.t);
  window.DUR = DUR; window.PERIOD = PERIOD;
  seek(0);
  window.READY = true;
})();
</script>
